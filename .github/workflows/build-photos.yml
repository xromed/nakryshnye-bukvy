name: build-photos
on:
  push:
    branches: [gh-pages]
    paths: ['chunks/**', '.github/workflows/build-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode chunks into photos
        run: python3 build_photos.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add photos
          git commit -m "Сборка фото из чанков" || exit 0
          git push
